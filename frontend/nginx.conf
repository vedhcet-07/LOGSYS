server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the FastAPI backend
    # In Docker Compose: BACKEND_URL = http://backend:8000  (internal DNS)
    # On Railway/Render:  BACKEND_URL = https://your-backend.up.railway.app
    location /api/ {
        proxy_pass         ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        
        # Do NOT override Host header, Render uses it for routing
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        # Required for external HTTPS APIs (like Render)
        proxy_ssl_server_name on;
    }

    # React SPA – serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

